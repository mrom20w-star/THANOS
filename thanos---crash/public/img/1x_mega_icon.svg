<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a36" stop-opacity="1"/>
      <stop offset="60%" stop-color="#070d1e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#03060d" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>

    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <linearGradient id="goldMega" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00d4ff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#spaceGlow)" stroke="url(#neonCyan)" stroke-width="4.5" filter="url(#subtleShadow)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(0, 212, 255, 0.25)" stroke-width="2" stroke-dasharray="16 10"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="rgba(255, 183, 3, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Orbital Sparkles / Dots -->
  <circle cx="90" cy="160" r="3.5" fill="#00ffff" opacity="0.8"/>
  <circle cx="420" cy="140" r="4" fill="#ffb703" opacity="0.9"/>
  <circle cx="430" cy="360" r="3" fill="#00ffff" opacity="0.7"/>
  <circle cx="85" cy="380" r="3" fill="#ffb703" opacity="0.6"/>

  <!-- Central Dynamic Supersonic Rocket / Energy Chevron -->
  <g transform="translate(256, 175) scale(0.95)" filter="url(#glowCyan)">
    <!-- Speed Wings / Chevrons -->
    <path d="M-140,50 L-60,-50 L-40,-50 L-100,50 Z" fill="url(#electricBlue)" opacity="0.6"/>
    <path d="M140,50 L60,-50 L40,-50 L100,50 Z" fill="url(#electricBlue)" opacity="0.6"/>

    <!-- Central Sonic Pulse -->
    <circle cx="0" cy="0" r="70" fill="rgba(0, 212, 255, 0.08)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>

  <!-- Stylized "1X" Display -->
  <g transform="translate(256, 195)" filter="url(#glowCyan)" text-anchor="middle">
    <!-- Main 1X Text with 3D Offset -->
    <text x="-4" y="38" font-family="'Orbitron', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="142" fill="#021226" letter-spacing="-2">1X</text>
    <text x="0" y="34" font-family="'Orbitron', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="142" fill="url(#neonCyan)" letter-spacing="-2">1X</text>
    <!-- Highlight Inner Line -->
    <text x="-2" y="32" font-family="'Orbitron', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="142" fill="#ffffff" opacity="0.25" letter-spacing="-2">1X</text>
  </g>

  <!-- Golden MEGA Banner Badge -->
  <g transform="translate(256, 335)">
    <!-- Badge Background Container -->
    <polygon points="-165,-5 -145,-38 145,-38 165,-5 145,28 -145,28" fill="#090d18" stroke="url(#goldMega)" stroke-width="3" filter="url(#glowGold)"/>
    
    <!-- Accent Side Cuts -->
    <polygon points="-165,-5 -152,-24 -140,-24 -153,-5" fill="url(#goldMega)"/>
    <polygon points="165,-5 152,-24 140,-24 153,-5" fill="url(#goldMega)"/>

    <!-- MEGA Typography -->
    <text x="0" y="8" font-family="'Orbitron', 'Cinzel', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="url(#goldMega)" text-anchor="middle" letter-spacing="8" filter="url(#glowGold)">MEGA</text>
  </g>

  <!-- Lower Tech Subtitle -->
  <g transform="translate(256, 405)">
    <text x="0" y="0" font-family="'Orbitron', monospace" font-weight="700" font-size="15" fill="#00ffd0" text-anchor="middle" letter-spacing="7" opacity="0.9">CRASH PREDICTOR</text>
    <line x1="-130" y1="12" x2="130" y2="12" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
