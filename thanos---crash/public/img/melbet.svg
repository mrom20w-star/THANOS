<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="melbetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC800"/>
      <stop offset="100%" stop-color="#E59B00"/>
    </linearGradient>
    <filter id="glowMel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFC800" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="220" height="220" rx="44" fill="url(#melbetBg)"/>
  <rect x="1.5" y="1.5" width="217" height="217" rx="42.5" fill="none" stroke="rgba(255,200,0,0.3)" stroke-width="3"/>

  <!-- Iconic Hexagon/M Emblem -->
  <g transform="translate(110, 85)" filter="url(#glowMel)">
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="none" stroke="url(#yellowGrad)" stroke-width="4.5"/>
    <!-- Stylized M letter -->
    <path d="M-22,22 L-22,-18 L0,5 L22,-18 L22,22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10,-6 L0,6 L10,-6" fill="none" stroke="url(#yellowGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- MELBET typography badge -->
  <g transform="translate(110, 168)">
    <rect x="-80" y="-18" width="82" height="36" rx="6" fill="#18181b"/>
    <text x="-39" y="7" font-family="'Cairo', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MEL</text>
    
    <rect x="2" y="-18" width="78" height="36" rx="6" fill="url(#yellowGrad)"/>
    <text x="41" y="7" font-family="'Cairo', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="22" fill="#000000" text-anchor="middle" letter-spacing="1">BET</text>
  </g>
</svg>
