<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="spinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a124a"/>
      <stop offset="60%" stop-color="#190a30"/>
      <stop offset="100%" stop-color="#0c0418"/>
    </linearGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd0"/>
      <stop offset="100%" stop-color="#00b488"/>
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#b01055"/>
    </linearGradient>
    <filter id="glowSpin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00ffd0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="220" height="220" rx="44" fill="url(#spinBg)"/>
  <rect x="1.5" y="1.5" width="217" height="217" rx="42.5" fill="none" stroke="rgba(0,255,208,0.3)" stroke-width="3"/>

  <!-- Iconic Spinning Roulette / Star Emblem -->
  <g transform="translate(110, 85)" filter="url(#glowSpin)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#neonTeal)" stroke-width="4" stroke-dasharray="14 6"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#neonMagenta)" stroke-width="3"/>
    
    <!-- Central Crown / S Starburst -->
    <path d="M0,-24 L6,-7 L24,-7 L10,4 L15,22 L0,11 L-15,22 L-10,4 L-24,-7 L-6,-7 Z" fill="url(#neonTeal)"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- SpinBetter typography -->
  <g transform="translate(110, 168)">
    <text x="-8" y="7" font-family="'Cairo', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="end" letter-spacing="0.5">Spin</text>
    <text x="-4" y="7" font-family="'Cairo', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="20" fill="url(#neonTeal)" text-anchor="start" letter-spacing="0.5">Better</text>
  </g>
</svg>
